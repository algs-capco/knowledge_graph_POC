[project]
name = "knowledge-graph-poc"
version = "0.1.0"
description = "Proof of concept for a knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knowledge-graph-poc = "knowledge_graph_poc:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
