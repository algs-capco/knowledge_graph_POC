[project]
name = "graph-poc"
version = "0.1.0"
description = "A lightweight Microsoft Graph and Dev Proxy proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "msgraph-sdk>=1.64.0",
]

[project.scripts]
graph-poc = "graph_poc:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
